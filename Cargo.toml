[package]
name = "terminal_sports"
version = "0.1.0"
edition = "2024"
autobins = false

[[bin]]
name = "sports"
path = "src/main.rs"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"

reqwest = { version = "0.12", features = ["blocking", "json"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4.44"
log = "0.4.29"
fern = "0.7.1"
rand = "0.10.0"
ratatui-toaster = "0.1.2"
regex = "1.12.3"
